name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          mkdir mdk
          cd mdk
          wget -q https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.4-49.2.13/forge-1.20.4-49.2.13-mdk.zip
          unzip -q forge-1.20.4-49.2.13-mdk.zip
          rm -rf src/main/java/com/example/examplemod
          unzip -q -o ../glassbridge-1.20.4-src.zip
          sed -i 's/^mod_id=.*/mod_id=glassbridge/' gradle.properties
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: glassbridge-mod
          path: mdk/build/libs/*.jar
